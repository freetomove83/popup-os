<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Popup OS — 랜딩 전체 스크롤 (1440)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="lp.css" />
<style>body{margin:0;background:#12141F;overflow-x:hidden} #root{transform-origin:0 0}</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="lp-base.jsx"></script>
<script type="text/babel" src="lp-sections.jsx"></script>
<script type="text/babel">
const root = document.getElementById('root');
function fit(){ const s = Math.min(1, window.innerWidth / 1440); root.style.transform = `scale(${s})`; document.body.style.height = (root.offsetHeight * s) + 'px'; }
ReactDOM.createRoot(root).render(<FullPage />);
window.addEventListener('resize', fit); setTimeout(fit, 50); setTimeout(fit, 800);
</script>
</body>
</html>
