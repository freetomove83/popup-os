<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Popup OS — 랜딩 시안</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="lp.css" />
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design_canvas.jsx"></script>
<script type="text/babel" src="lp-base.jsx"></script>
<script type="text/babel" src="lp-sections.jsx"></script>
<script type="text/babel" src="lp-boards.jsx"></script>
<script type="text/babel">
function App() {
  return (
    <DesignCanvas>
      <DCSection id="hero" title="01 · 히어로" subtitle="데스크톱 1440 · 모바일 390 — 1순위 CTA [도입 문의]">
        <DCArtboard id="hero-d" label="Hero · Desktop 1440" width={1440} height={880}><HeroDesktop /></DCArtboard>
        <DCArtboard id="hero-m" label="Hero · Mobile 390" width={390} height={872}><HeroMobile /></DCArtboard>
      </DCSection>
      <DCSection id="full" title="02 · 전체 스크롤" subtitle="§3.1 → §3.11 · 1440 기준 한 장">
        <DCArtboard id="full-page" label="Full page · 1440" width={1440} height={10405}><FullPage /></DCArtboard>
        <DCArtboard id="copy-audit" label="카피 규칙 점검 (자동)" width={760} height={1881}><CopyAudit /></DCArtboard>
      </DCSection>
      <DCSection id="kv" title="03 · 키비주얼 배치안" subtitle="실제 제품 캡처만 사용 — A안을 기본 채택">
        <DCArtboard id="kv-a" label="A · 겹침 + 상태 카드 (채택)" width={1440} height={880}><KVOption variant="overlap" label="A · 콘솔 우측 블리드 + 모바일 겹침 + 상태 플로팅 카드" /></DCArtboard>
        <DCArtboard id="kv-b" label="B · 원근 기울임" width={1440} height={880}><KVOption variant="tilt" label="B · 콘솔 원근 기울임 + 모바일 전면" /></DCArtboard>
        <DCArtboard id="kv-c" label="C · 나란히" width={1440} height={880}><KVOption variant="side" label="C · 콘솔·모바일 나란히 (가장 보수적)" /></DCArtboard>
        <DCArtboard id="kv-map" label="섹션별 화면 소스" width={1100} height={1600}><KVMap /></DCArtboard>
      </DCSection>
      <DCSection id="pricing" title="04 · 요금제 3플랜" subtitle="Pro 강조 · 가격은 플레이스홀더">
        <DCArtboard id="pricing-d" label="Pricing · 1440" width={1440} height={1039}><Pricing /></DCArtboard>
      </DCSection>
      <DCSection id="system" title="05 · 타이포 스케일 · 핸드오프" subtitle="§4 토큰 그대로 + 랜딩 확장 스케일">
        <DCArtboard id="type" label="랜딩 타이포 스케일" width={1240} height={1225}><TypeScale /></DCArtboard>
        <DCArtboard id="handoff" label="핸드오프 노트" width={1240} height={1033}><Handoff /></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
